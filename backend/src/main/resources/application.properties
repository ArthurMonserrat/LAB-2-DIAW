spring.application.name=volante
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lab2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.agent-username=${AGENT_USERNAME:}
app.agent-password=${AGENT_PASSWORD:}
app.bank-username=${BANK_USERNAME:}
app.bank-password=${BANK_PASSWORD:}
